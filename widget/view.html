<link rel="stylesheet" type="text/css" href="{{widgetCSS}}" />

<div class="widget widget-container chart" style="height: 100%; width: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; border: none; box-shadow: none;">
  
  <div class="display-flex-space-between margin-chart" style="min-height: 30px; border-bottom: none !important;">
    <div class="padding-right-0 padding-left-0 widget-dashboard-title-width"
      data-ng-class="(page === 'dashboard' || page === 'reporting') ? 'widget-dashboard-title-width' : 'widget-title-width'">
      
      <span class="widget-title-span">&nbsp;</span>
      
    </div>
    <div class="padding-right-0 padding-left-0"
      data-ng-class="(page === 'dashboard' || page === 'reporting') ? 'widget-dashboard-actions-width' : 'widget-actions-width'">
    </div>
  </div>

  <div id="viewPanelBottomBar" class="padding-0" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative; border-top: none !important;">
    
    <div class="row" style="display: flex; width: 100%; justify-content: center; align-items: center; margin: 0;">
      
      <button id="{{action.text}}-btn"
        data-ng-class="{'btn-sm': size === 'sm', 'btn-primary': config.showPrimaryButton, 'btn-default': !config.showPrimaryButton}"
        class="playbook-button-box-shadow list-action btn action-button ng-binding ng-scope btn-sm"
        style="margin: 0; display: flex; justify-content: center; align-items: center; text-align: center;" 
        type="button" data-ng-click="action.onClick()" ng-repeat="action in actionButtonPlaybooks"
        title="{{action.desc}}" data-ng-hide="action._hide">
        
        <span data-ng-if="action.icon !== 'fa fa-fa fa-none'" style="display: flex; align-items: center;">
            <span class="{{ action.icon }}"></span>&nbsp;&nbsp;
        </span>
        {{action.text}}
      </button>
      
    </div>
  </div>
</div>
